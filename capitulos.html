<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Capítulos — THE OTHER SIDE</title>

    <style>

        /* =========================
           CONFIGURAÇÃO GERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #050509;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           PARTÍCULAS
        ========================= */

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            bottom: -20px;

            width: 4px;
            height: 4px;

            background: white;
            border-radius: 50%;

            opacity: 0;

            box-shadow: 0 0 10px white;

            animation: subir 8s linear infinite;
        }

        .particle:nth-child(1) {
            left: 5%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 15%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            left: 25%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            left: 35%;
            animation-delay: 1s;
        }

        .particle:nth-child(5) {
            left: 45%;
            animation-delay: 3s;
        }

        .particle:nth-child(6) {
            left: 55%;
            animation-delay: 5s;
        }

        .particle:nth-child(7) {
            left: 65%;
            animation-delay: 2s;
        }

        .particle:nth-child(8) {
            left: 75%;
            animation-delay: 4s;
        }

        .particle:nth-child(9) {
            left: 85%;
            animation-delay: 1s;
        }

        .particle:nth-child(10) {
            left: 95%;
            animation-delay: 3s;
        }

        @keyframes subir {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }

        }


        /* =========================
           CABEÇALHO
        ========================= */

        header {
            position: relative;
            z-index: 1;

            text-align: center;

            padding: 100px 20px;

            background:
                radial-gradient(
                    circle at center,
                    #24113d 0%,
                    #100b1d 35%,
                    #050509 75%
                );

            border-bottom: 1px solid #3d2161;
        }

        header h1 {
            margin: 0;

            font-size: 55px;

            letter-spacing: 8px;

            text-shadow:
                0 0 10px #8b5cf6,
                0 0 25px #5b21b6,
                0 0 50px #312e81;
        }

        header h2 {
            margin-top: 20px;

            color: #b8a8d8;

            letter-spacing: 4px;
        }


        /* =========================
           MENU
        ========================= */

        nav {
            position: relative;
            z-index: 2;

            text-align: center;

            padding: 20px;

            background: #09090f;

            border-bottom: 1px solid #21172d;
        }

        nav a {
            display: inline-block;

            color: #dcd2ee;

            text-decoration: none;

            padding: 12px 20px;

            margin: 5px;

            border: 1px solid #35264b;

            border-radius: 8px;

            transition: 0.3s;
        }

        nav a:hover {
            color: white;

            background: #27133d;

            border-color: #8b5cf6;

            box-shadow:
                0 0 10px #6d28d9,
                0 0 20px #4c1d95;

            transform: translateY(-2px);
        }


        /* =========================
           CONTEÚDO
        ========================= */

        main {
            position: relative;
            z-index: 1;

            max-width: 900px;

            margin: auto;

            padding: 40px 20px;
        }

        section {
            padding: 50px 30px;

            margin-bottom: 25px;

            background: rgba(15, 10, 25, 0.75);

            border: 1px solid #2d1b42;

            border-radius: 12px;

            transition: 0.3s;
        }

        section:hover {
            border-color: #6d28d9;

            box-shadow:
                0 0 15px rgba(109, 40, 217, 0.3);
        }

        section h2 {
            color: #d8c7ff;

            font-size: 32px;

            letter-spacing: 3px;

            text-shadow:
                0 0 10px #6d28d9;
        }

        section p {
            color: #c8c2d1;

            line-height: 1.7;
        }

        section a {
            display: inline-block;

            margin-top: 10px;

            color: white;

            text-decoration: none;

            padding: 12px 18px;

            background: #24113d;

            border: 1px solid #8b5cf6;

            border-radius: 8px;

            transition: 0.3s;
        }

        section a:hover {
            background: #4c1d95;

            box-shadow:
                0 0 15px #7c3aed,
                0 0 30px #4c1d95;
        }


        /* =========================
           RODAPÉ
        ========================= */

        footer {
            position: relative;
            z-index: 1;

            text-align: center;

            padding: 45px 20px;

            background: #08080d;

            color: #70677c;

            border-top: 1px solid #21172d;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 38px;

                letter-spacing: 5px;
            }

            header {
                padding: 70px 15px;
            }

            section {
                padding: 35px 20px;
            }

        }

    </style>
